# comitup — wifi onboarding for a headless appliance.
# When no known wifi is reachable, the Pi raises its own access point named
# below; once it joins a network, comitup stays out of the way. comitup's own
# web portal (comitup-web) is masked by install-kiosk.sh: our server on :80
# serves the setup page (/setup) and redirects captive-portal probes to it,
# driving comitup over D-Bus.
#
# Connect to the "ToernooiTV-setup-<id>" network, then browse to http://10.41.0.1
# (most phones pop the captive portal automatically) → the wifi setup page.

ap_name: ToernooiTV-setup-<nnnn>
# Appliance mode: kept on. It no longer has anything to do with port 80 —
# comitup-web is masked and our server owns :80 at all times (toernooitv.local/beheer).
enable_appliance_mode: 1
# Debug logging to /var/log/comitup.log ("Running dnsmasq", "nmm - primary state"
# lines) so a hotspot that hands out no addresses is diagnosable in the field.
verbose: 1
