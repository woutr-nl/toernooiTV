# comitup — wifi onboarding for a headless appliance.
# When no known wifi is reachable, the Pi raises its own access point named
# below and serves a web portal so you can pick the venue's wifi and enter its
# password from a phone/laptop. Once it joins, comitup stays out of the way.
#
# Connect to the "ToernooiTV-setup-<id>" network, then browse to http://10.41.0.1
# (most phones pop the captive portal automatically).

ap_name: ToernooiTV-setup-<nnnn>
# Appliance mode: only serve the comitup web portal (port 80) while the setup
# hotspot is up. Once joined to a venue's wifi it releases port 80, so our own
# server can answer on toernooitv.local/beheer with no :port.
enable_appliance_mode: 1
